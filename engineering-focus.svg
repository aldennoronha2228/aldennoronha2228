<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Software engineering focus and delivery loop</title>
  <desc id="desc">Product engineering focus followed by a plan, build, ship workflow.</desc>
  <rect width="1200" height="430" rx="8" fill="#161616"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F6F0E6">
    <text x="44" y="52" font-size="16" font-weight="700" letter-spacing="3">02 / SOFTWARE ENGINEERING FOCUS</text>
    <line x1="44" y1="72" x2="1156" y2="72" stroke="#F6F0E6" stroke-opacity=".25"/>
    <rect x="44" y="102" width="532" height="144" rx="6" fill="#252525" stroke="#F6F0E6" stroke-opacity=".25"/>
